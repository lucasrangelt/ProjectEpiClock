name: "project-epiclock"

services:
  postgres_vector:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${ENV_USER}
      POSTGRES_PASSWORD: ${ENV_PASSWORD}
      POSTGRES_DB: ${ENV_DATABASE}
  
  synthea_generator:
    image: openjdk:17-slim
    volumes:
      - ./data:/output
    command: >
      sh -c "git clone https://github.com/synthetichealth/synthea.git &&
            cd synthea && ./gradlew build &&
            ./run_synthea -p 100 --exporter.baseDirectory=/output"

  epiclock_app:
    build:
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      - postgres_vector
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}

volumes:
  postgres_vector: